# Выпуск релиза целиком в CI: сборка, подпись, публикация и обновление манифеста.
# Локальная машина не нужна — цепочка сборки берётся из Android SDK на раннере.
#
# Источник правды по версии — android/AndroidManifest.xml. version.json больше не вход,
# а выход: он пишется ПОСЛЕ публикации релиза, по факту выпущенного APK. Поэтому
# apkSha256 в нём не может разойтись с опубликованным файлом, а игроки не видят
# версию, для которой ещё нет сборки.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v1.9. Если такого тега нет, он будет создан на выбранной ветке.'
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Определить тег
        id: rel
        env:
          IN_TAG: ${{ inputs.tag }}
        run: |
          TAG="${IN_TAG:-$GITHUB_REF_NAME}"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::тег должен выглядеть как v1.9, получено: $TAG"; exit 1 ;;
          esac
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Сверить версию в трёх местах
        env:
          TAG_NAME: ${{ steps.rel.outputs.tag }}
        run: |
          TAG="${TAG_NAME#v}"
          MAN=$(grep -o 'android:versionName="[^"]*"' android/AndroidManifest.xml | cut -d'"' -f2)
          COD=$(grep -o 'android:versionCode="[^"]*"' android/AndroidManifest.xml | cut -d'"' -f2)
          VER=$(grep -o "const VERSION = '[^']*'" game/game.js | cut -d"'" -f2)
          CDE=$(grep -oE 'const CODE = [0-9]+' game/update.js | grep -oE '[0-9]+')
          echo "тег=$TAG манифест=$MAN/$COD game.js=$VER update.js=$CDE"
          if [ "$TAG" != "$MAN" ] || [ "$TAG" != "$VER" ] || [ "$COD" != "$CDE" ]; then
            echo "::error::версия разошлась. Правь её только через tools/release.py, он поднимает все три места разом."; exit 1
          fi

      - name: Собрать HTML
        run: python3 build_html.py

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      # APK либо собирается здесь из секретов, либо берётся готовым из prebuilt/
      # (запасной путь, когда сборку делали руками). Приоритет у готового файла.
      - name: Подготовить APK
        id: apk
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p dist
          if [ -f prebuilt/Grimhold3D.apk ]; then
            echo "::notice::беру готовый APK из prebuilt/"
            cp prebuilt/Grimhold3D.apk dist/Grimhold3D.apk
            echo "built=yes" >> $GITHUB_OUTPUT; exit 0
          fi
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::нет ни prebuilt/Grimhold3D.apk, ни секрета KEYSTORE_B64 — релиз выйдет только с HTML"
            echo "built=no" >> $GITHUB_OUTPUT; exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          JAR="$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
          B=android/build; rm -rf $B; mkdir -p $B/res $B/classes $B/dex
          "$BT/aapt2" compile --dir android/res -o $B/res/compiled.zip
          "$BT/aapt2" link -o $B/resources.apk -I "$JAR" --manifest android/AndroidManifest.xml \
            -A game --auto-add-overlay --java $B/gen $B/res/compiled.zip
          javac --release 8 -encoding UTF-8 -nowarn -classpath "$JAR" -d $B/classes \
            $(find android/src $B/gen -name '*.java')
          "$BT/d8" --release --min-api 26 --lib "$JAR" --output $B/dex $(find $B/classes -name '*.class')
          python3 pack.py $B/resources.apk $B/dex/classes.dex $B/unsigned.apk
          "$BT/apksigner" sign --ks /tmp/release.keystore --ks-pass "pass:$KEYSTORE_PASS" \
            --key-pass "pass:$KEYSTORE_PASS" --ks-key-alias "$KEY_ALIAS" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out dist/Grimhold3D.apk $B/unsigned.apk
          "$BT/apksigner" verify --verbose dist/Grimhold3D.apk
          rm -f /tmp/release.keystore
          echo "built=yes" >> $GITHUB_OUTPUT

      # Готовый APK из prebuilt/ может оказаться от прошлой версии. Тогда игра поставит
      # сборку со старым versionCode и снова предложит то же обновление — по кругу.
      - name: Сверить versionCode внутри APK
        if: steps.apk.outputs.built == 'yes'
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          GOT=$("$BT/aapt2" dump badging dist/Grimhold3D.apk | grep -oE "versionCode='[0-9]+'" | grep -oE '[0-9]+')
          WANT=$(grep -o 'android:versionCode="[^"]*"' android/AndroidManifest.xml | cut -d'"' -f2)
          echo "в APK versionCode=$GOT, в манифесте $WANT"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::APK собран для versionCode $GOT, а выпускается $WANT. Похоже, в prebuilt/ лежит файл от прошлой версии."; exit 1
          fi

      - name: Текст релиза
        run: python3 tools/notes.py > NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          body_path: NOTES.md
          files: |
            dist/Grimhold3D.apk
            dist/Grimhold3D.html
          fail_on_unmatched_files: false

      # Манифест обновляем последним: до этого момента у игроков в version.json стоит
      # прошлая версия, и никто не видит обновления, для которого ещё нет файла.
      - name: Обновить version.json в main
        if: steps.apk.outputs.built == 'yes'
        env:
          TAG_NAME: ${{ steps.rel.outputs.tag }}
        run: |
          python3 tools/make_manifest.py "$TAG_NAME" dist/Grimhold3D.apk
          cp version.json /tmp/version.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -f -B main origin/main
          cp /tmp/version.json version.json
          git add version.json
          if git diff --cached --quiet; then echo "манифест не изменился"; exit 0; fi
          git commit -m "version.json: $TAG_NAME по факту выпущенного APK

          Сгенерирован tools/make_manifest.py из AndroidManifest.xml, CHANGELOG.md
          и опубликованного файла, поэтому apkSha256 совпадает с релизом по построению."
          git push origin main
